<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1230"/>
      <stop offset="1" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="env" x1="120" y1="250" x2="392" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b63e6"/>
      <stop offset="1" stop-color="#3a43c9"/>
    </linearGradient>
    <linearGradient id="wedgeA" x1="110" y1="210" x2="200" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00cb91"/>
      <stop offset="1" stop-color="#3ee0b6"/>
    </linearGradient>
    <linearGradient id="wedgeC" x1="312" y1="140" x2="406" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a61d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" stroke="#9ca6ff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- fan of budget wedges rising from the envelope -->
  <path d="M256 300 L107.6 207.2 A175 175 0 0 1 190.4 137.8 Z" fill="url(#wedgeA)"/>
  <path d="M256 300 L201.9 133.6 A175 175 0 0 1 310.1 133.6 Z" fill="#27cfc1"/>
  <path d="M256 300 L321.6 137.8 A175 175 0 0 1 404.4 207.2 Z" fill="url(#wedgeC)"/>

  <!-- envelope -->
  <rect x="112" y="214" width="288" height="204" rx="30" fill="url(#env)"/>
  <path d="M124 232 L256 330 L388 232" stroke="#0d1030" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 410 L232 314 A32 32 0 0 1 280 314 L394 410" stroke="#aeb6ff" stroke-opacity="0.35" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
